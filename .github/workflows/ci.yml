name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk
          POSTGRES_DB: opsdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsdesk" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://opsdesk:opsdesk@localhost:5432/opsdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node src/cli/aiops.ts config validate
